<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шаблоны писем · StopVertigo · Клифар CRM</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
body{background:#eef1f5;margin:0}
.tp-w{max-width:760px;margin:0 auto;padding:28px 16px 48px}
.tp-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.tp-top img{height:38px;mix-blend-mode:multiply}.tp-top .sp{flex:1}
.tp-card{background:#fff;border-radius:14px;padding:20px 22px;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.tp-card h1{font-size:20px;margin:0 0 4px}
.tp-list a{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}
.tp-list a:hover b{color:#1d4ed8}.tp-list span{color:#667085;min-width:110px}
.tp-nav{display:flex;gap:8px;margin-top:14px;font-size:13px}.tp-nav a{color:#1d4ed8}
</style>
</head>
<body>
<div class="tp-w" id="tp"></div>
<script>window.AUDIO_META = {};</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/email-tpl.js"></script>
<script>
(function () {
  const DB = window.DB, el = document.getElementById('tp');
  const fmt = n => Math.round(n).toLocaleString('ru-RU');
  const d2 = d => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
  const t2 = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const top = `<div class="tp-top"><img src="../assets/logo.png" alt="Клифар CRM"><span class="sp"></span><span class="tag">Демо · StopVertigo 2025</span></div>`;
  const code = new URLSearchParams(location.search).get('t');
  const all = []; DB.EMAILS.forEach(e => { all.push([e, false]); all.push([e, true]); });
  const hit = all.find(([e, r]) => (r ? e.re.tpl : e.tpl) === code);
  if (!hit) {
    el.innerHTML = top + `<div class="tp-card"><h1>Шаблоны писем проекта StopVertigo</h1><div class="muted" style="font-size:13px;margin-bottom:10px">24 рассылки и повторные отправки тем, кто не открыл письмо</div><div class="tp-list">${all.map(([e, r]) => { const m = r ? e.re : e; return `<a href="?t=${m.tpl}"><span class="num">${m.tpl}</span><b style="font-weight:${r ? 400 : 600}">${m.subject}</b></a>`; }).join('')}</div></div>`;
    document.title = 'Шаблоны писем · StopVertigo'; return;
  }
  const [e, r] = hit; const m = r ? e.re : e;
  document.title = m.tpl + ' · ' + m.subject;
  const i = all.indexOf(hit), prev = all[i - 1], next = all[i + 1];
  const tc = x => x ? (x[1] ? x[0].re.tpl : x[0].tpl) : '';
  el.innerHTML = top + `<div class="tp-card">
    <h1>Шаблон ${m.tpl}${r ? ' · повтор' : ''}</h1>
    <div class="em-meta" style="margin-top:10px"><div><span>От</span><b>Проект StopVertigo &lt;info@stopvertigo.ru&gt;</b></div><div><span>Тема</span><b>${m.subject}</b></div><div><span>Прехедер</span>${EMAIL_TPL.pre(r)}</div><div><span>Отправка</span>${d2(m.date)} в ${t2(m.date)} · ${fmt(m.sent)} получателей${r ? ' · не открывшие основное письмо' : ''}</div></div>
    ${EMAIL_TPL.render(e, r)}
    <div class="tp-nav">${prev ? `<a href="?t=${tc(prev)}">← ${tc(prev)}</a>` : ''}<span style="flex:1"></span><a href="index.html">Все шаблоны</a><span style="flex:1"></span>${next ? `<a href="?t=${tc(next)}">${tc(next)} →</a>` : ''}</div>
  </div>`;
  el.querySelectorAll('[data-lk]').forEach(a => a.addEventListener('click', ev => ev.preventDefault()));
})();
</script>
</body>
</html>
